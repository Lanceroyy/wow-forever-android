name: ARM64 Android lab preflight

"on":
  workflow_dispatch:
  push:
    branches: [security/hardening-v1]
    paths: [.github/workflows/arm64-lab-preflight.yml]

permissions:
  contents: read

jobs:
  kernel-and-docker-metadata:
    if: github.repository == 'Lanceroyy/wow-forever-android' && github.ref == 'refs/heads/security/hardening-v1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Read kernel and Docker prerequisites without changing the runner
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import shutil
          import stat
          import subprocess

          def read_text(path, limit=2097152):
              try:
                  with Path(path).open('rb') as stream:
                      data = stream.read(limit + 1)
                  return data.decode('utf-8', errors='replace') if len(data) <= limit else None
              except OSError:
                  return None

          def character_device(path):
              try:
                  value = Path(path).stat()
                  return {'present': True, 'character_device': stat.S_ISCHR(value.st_mode)}
              except OSError:
                  return {'present': False, 'character_device': False}

          release = platform.release()
          report = {
              'scope': 'Read-only ARM64 Android lab prerequisites; no Android, GPU, or app execution',
              'machine': platform.machine(),
              'kernel_release': release,
              'page_size': os.sysconf('SC_PAGE_SIZE'),
              'devices': {name: character_device('/dev/' + name) for name in (
                  'binder', 'hwbinder', 'vndbinder', 'ashmem', 'kvm', 'ion', 'dma_heap/system')},
              'binderfs_directory_present': Path('/dev/binderfs').is_dir(),
              'matching_kernel_build_tree_present': Path('/lib/modules/' + release + '/build/Makefile').is_file(),
              'privileged_container_tested': False,
              'modules_loaded_by_probe': False,
          }
          filesystems = read_text('/proc/filesystems') or ''
          report['binderfs_registered'] = any(line.split()[-1:] == ['binder'] for line in filesystems.splitlines())
          modules = read_text('/proc/modules') or ''
          loaded = {line.split()[0] for line in modules.splitlines() if line.split()}
          report['loaded_android_modules'] = {name: name in loaded for name in ('binder_linux', 'ashmem_linux')}
          disabled = read_text('/proc/sys/kernel/modules_disabled', 64)
          report['kernel_modules_disabled'] = int(disabled.strip()) if disabled and disabled.strip() in ('0', '1') else None
          status = read_text('/proc/self/status', 16384) or ''
          caps = {}
          for line in status.splitlines():
              key, _, value = line.partition(':')
              if key in ('CapEff', 'CapPrm', 'CapBnd') and re.fullmatch(r'[0-9a-fA-F]{1,16}', value.strip()):
                  caps[key] = value.strip()
          report['probe_process_capability_masks'] = caps

          config = None
          source = None
          for label, path in (
              ('boot_config', '/boot/config-' + release),
              ('matching_headers_config', '/lib/modules/' + release + '/build/.config'),
          ):
              config = read_text(path)
              if config is not None:
                  source = label
                  break
          if config is None:
              try:
                  with gzip.open('/proc/config.gz', 'rb') as stream:
                      data = stream.read(2097153)
                  if len(data) <= 2097152:
                      config = data.decode('utf-8', errors='replace')
                      source = 'proc_config_gz'
              except (OSError, EOFError):
                  pass
          keys = ('CONFIG_ANDROID_BINDER_IPC', 'CONFIG_ANDROID_BINDERFS', 'CONFIG_ASHMEM',
                  'CONFIG_MEMFD_CREATE', 'CONFIG_DMABUF_HEAPS', 'CONFIG_DMABUF_HEAPS_SYSTEM',
                  'CONFIG_ION', 'CONFIG_IPV6', 'CONFIG_MODULES', 'CONFIG_MODULE_SIG_FORCE')
          states = {key: 'unavailable' if config is None else 'unspecified' for key in keys}
          for line in (config or '').splitlines():
              for key in keys:
                  if line == '# ' + key + ' is not set':
                      states[key] = 'n'
                  elif line.startswith(key + '=') and line[len(key) + 1:] in ('y', 'm', 'n'):
                      states[key] = line[len(key) + 1:]
          report['kernel_config_source'] = source
          report['kernel_config'] = states

          modinfo = shutil.which('modinfo')
          module_metadata = {}
          for name in ('binder_linux', 'ashmem_linux'):
              value = {'modinfo_available': modinfo is not None}
              if modinfo:
                  try:
                      result = subprocess.run([modinfo, '-F', 'filename', name], capture_output=True, text=True, timeout=10)
                      value.update({'exit': result.returncode, 'module_metadata_present': result.returncode == 0,
                                    'builtin': result.returncode == 0 and result.stdout.strip() == '(builtin)'})
                  except (OSError, subprocess.TimeoutExpired):
                      value['incomplete'] = True
              module_metadata[name] = value
          report['android_module_metadata'] = module_metadata

          docker = shutil.which('docker')
          report['docker_client_present'] = docker is not None
          if docker:
              # Read only the local daemon. Avoid any user's Docker contexts or credentials.
              empty_config = '/proc/self/arm64-preflight-no-client-config'
              assert not Path(empty_config).exists()
              template = ('{"architecture":{{json .Architecture}},"kernel_version":{{json .KernelVersion}},'
                          '"storage_driver":{{json .Driver}},"cgroup_version":{{json .CgroupVersion}},'
                          '"security_options":{{json .SecurityOptions}}}')
              try:
                  result = subprocess.run([docker, '--config', empty_config, '--host', 'unix:///var/run/docker.sock',
                                           'info', '--format', template], capture_output=True, text=True, timeout=15)
                  report['docker_info_exit'] = result.returncode
                  if result.returncode == 0 and len(result.stdout) <= 8192:
                      info = json.loads(result.stdout)
                      if isinstance(info, dict) and set(info) == {
                          'architecture', 'kernel_version', 'storage_driver', 'cgroup_version', 'security_options'}:
                          report['docker_metadata'] = info
              except (OSError, ValueError, subprocess.TimeoutExpired):
                  report['docker_metadata_incomplete'] = True
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Boot the pinned stock ARM64 image without APKs or published ports
        shell: bash
        run: |
          sudo -n python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import shutil
          import stat
          import subprocess
          import tempfile
          import time
          import uuid

          image = 'redroid/redroid@sha256:b21c57533662275928832602f7c09b83cb198aa9b271135ae49d978857d6795f'
          expected_image_id = 'sha256:c9c5cfdc4671d32340b5305f623e286c29da971b5f22d382e78829c9282a16d0'
          owner = uuid.uuid4().hex
          name = 'wow-arm64-boot-' + owner[:16]
          work = Path(tempfile.mkdtemp(prefix='wow-arm64-boot-', dir='/tmp')).resolve()
          (work / '.owned-arm64-boot').write_text(owner)
          data = work / 'data'
          data.mkdir(mode=0o700)
          cidfile = work / 'container.cid'
          empty_config = '/proc/self/arm64-preflight-no-client-config'
          assert not Path(empty_config).exists()
          docker = [shutil.which('docker'), '--config', empty_config, '--host', 'unix:///var/run/docker.sock']
          started = time.monotonic()
          deadline = started + 480
          cid = None
          report = {'scope': 'Disposable stock ARM64 Android boot only; no APK, HAL, game, input, or credential test',
                    'boot_only_pass': False, 'apks_uploaded': False, 'hal_overlays': False,
                    'adb_published': False, 'owned_container_removed': False}

          def command(args, seconds=20):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError()
              return subprocess.run(args, capture_output=True, text=True, timeout=min(seconds, remaining))

          def checked(args, seconds=20):
              value = command(args, seconds)
              if value.returncode:
                  raise RuntimeError('Boot prerequisite command failed')
              return value.stdout

          def owned_container(identity, cleanup=False):
              runner = subprocess.run if cleanup else command
              if cleanup:
                  inspected = runner(docker + ['inspect', identity], capture_output=True, text=True, timeout=15)
              else:
                  inspected = runner(docker + ['inspect', identity], 15)
              if inspected.returncode:
                  raise RuntimeError('Owned container identity unavailable')
              value = json.loads(inspected.stdout)[0]
              assert value['Id'] == identity and value['Name'] == '/' + name
              assert value['Config']['Image'] == image
              assert value['Image'] == expected_image_id
              assert value['Config']['Labels'].get('io.wowforever.boot-owner') == owner
              mounts = value['Mounts']
              selected = [row for row in mounts if row['Destination'] == '/data']
              assert len(selected) == 1 and selected[0]['Source'] == str(data)
              assert (work / '.owned-arm64-boot').read_text() == owner
              return value

          try:
              assert os.geteuid() == 0 and platform.machine() == 'aarch64'
              assert os.sysconf('SC_PAGE_SIZE') == 4096
              assert docker[0] is not None
              modprobe = shutil.which('modprobe')
              modinfo = shutil.which('modinfo')
              assert modprobe is not None and modinfo is not None
              for module in ('binder_linux', 'loop', 'dm_mod'):
                  assert command([modinfo, '-F', 'filename', module]).returncode == 0
              checked([modprobe, 'binder_linux', 'devices=binder,hwbinder,vndbinder'])
              checked([modprobe, 'loop'])
              checked([modprobe, 'dm_mod'])
              devices = ['/dev/binder', '/dev/hwbinder', '/dev/vndbinder']
              required_devices = devices + ['/dev/loop-control', '/dev/mapper/control']
              until = min(deadline, time.monotonic() + 10)
              while time.monotonic() < until:
                  if all(Path(path).exists() and stat.S_ISCHR(Path(path).stat().st_mode) for path in required_devices):
                      break
                  time.sleep(0.5)
              assert all(stat.S_ISCHR(Path(path).stat().st_mode) for path in required_devices)
              report['distro_binder_loop_device_mapper_ready'] = True
              checked(docker + ['pull', '--quiet', '--platform=linux/arm64', image], 180)
              identity = json.loads(checked(docker + ['image', 'inspect', image]))[0]
              assert identity['Id'] == expected_image_id and identity['Architecture'] == 'arm64'
              assert identity['Os'] == 'linux' and image in identity['RepoDigests']
              report['pinned_image_id'] = identity['Id']
              args = docker + ['create', '--pull=never', '--platform=linux/arm64', '--name', name,
                  '--cidfile', str(cidfile), '--label', 'io.wowforever.boot-owner=' + owner,
                  '--privileged', '--network=none', '--cpus=4', '--memory=8g', '--memory-swap=8g',
                  '--mount', 'type=bind,src=' + str(data) + ',dst=/data']
              for device in devices:
                  args += ['--mount', 'type=bind,src=' + device + ',dst=' + device]
              args += [image, 'androidboot.use_memfd=1', 'androidboot.redroid_width=540',
                       'androidboot.redroid_height=960', 'androidboot.redroid_dpi=240',
                       'androidboot.redroid_gpu_mode=guest']
              checked(args, 30)
              cid = cidfile.read_text().strip()
              assert re.fullmatch('[0-9a-f]{64}', cid)
              meta = owned_container(cid)
              assert meta['HostConfig']['Memory'] == 8589934592
              assert meta['HostConfig']['MemorySwap'] == 8589934592
              assert meta['HostConfig']['NanoCpus'] == 4000000000
              assert meta['HostConfig']['NetworkMode'] == 'none'
              assert not meta['HostConfig']['PortBindings']
              checked(docker + ['start', cid], 30)
              report['owned_container_started'] = True
              boot_deadline = min(deadline - 30, time.monotonic() + 300)
              boot = ''
              while time.monotonic() < boot_deadline:
                  meta = owned_container(cid)
                  if not meta['State']['Running']:
                      report['container_exit_code'] = meta['State']['ExitCode']
                      break
                  try:
                      query = command(docker + ['exec', cid, '/system/bin/getprop', 'sys.boot_completed'], 10)
                      if query.returncode == 0 and query.stdout.strip() == '1':
                          boot = '1'
                          break
                  except subprocess.TimeoutExpired:
                      pass
                  time.sleep(3)
              report['boot_completed'] = boot == '1'
              properties = {}
              for key in ('ro.build.version.sdk', 'ro.product.cpu.abi', 'ro.dalvik.vm.native.bridge'):
                  query = command(docker + ['exec', cid, '/system/bin/getprop', key], 10)
                  value = query.stdout.strip() if query.returncode == 0 else ''
                  properties[key] = value if re.fullmatch('[A-Za-z0-9._-]{0,64}', value) else 'unclassified'
              report['public_properties'] = properties
              services = {}
              for service in ('window', 'SurfaceFlinger'):
                  query = command(docker + ['exec', cid, '/system/bin/service', 'check', service], 10)
                  services[service] = query.returncode == 0 and query.stdout.strip() == 'Service ' + service + ': found'
              report['public_services_found'] = services
              before_wms = time.monotonic()
              query = command(docker + ['exec', cid, '/system/bin/timeout', '10', '/system/bin/dumpsys', 'window'], 15)
              report['wms_query_seconds'] = round(time.monotonic() - before_wms, 3)
              report['wms_query_exit'] = query.returncode
              report['wms_responsive'] = query.returncode == 0 and 'WINDOW MANAGER' in query.stdout
              report['display_enabled'] = 'mDisplayEnabled=true' in query.stdout
              report['system_booted'] = 'mSystemBooted=true' in query.stdout
              meta = owned_container(cid)
              report['container_running'] = meta['State']['Running']
              report['container_oom_killed'] = meta['State']['OOMKilled']
              report['boot_only_pass'] = (meta['State']['Running'] and not meta['State']['OOMKilled'] and boot == '1' and properties == {
                  'ro.build.version.sdk': '35', 'ro.product.cpu.abi': 'arm64-v8a',
                  'ro.dalvik.vm.native.bridge': '0'} and all(services.values()) and
                  report['wms_responsive'] and report['display_enabled'] and report['system_booted'])
          except Exception as failure:
              report['incomplete'] = True
              report['error_class'] = type(failure).__name__ if type(failure).__name__ in (
                  'AssertionError', 'TimeoutError', 'TimeoutExpired', 'RuntimeError',
                  'FileNotFoundError', 'PermissionError', 'ValueError', 'KeyError', 'OSError') else 'OtherError'
          finally:
              try:
                  if cid is None and cidfile.is_file():
                      candidate = cidfile.read_text().strip()
                      if re.fullmatch('[0-9a-f]{64}', candidate):
                          cid = candidate
                  if cid is not None:
                      owned_container(cid, cleanup=True)
                      subprocess.run(docker + ['stop', '--time', '10', cid], capture_output=True, timeout=20)
                      removed = subprocess.run(docker + ['rm', '--force', cid], capture_output=True, timeout=20)
                      report['owned_container_removed'] = removed.returncode == 0
              except Exception:
                  report['owned_cleanup_incomplete'] = True
              report['elapsed_seconds'] = round(time.monotonic() - started, 3)
              report['ephemeral_stock_data_retained_on_disposable_runner'] = True
              print(json.dumps(report, sort_keys=True))
          raise SystemExit(0 if report['boot_only_pass'] and report['owned_container_removed'] else 1)
          PY
