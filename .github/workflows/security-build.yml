name: Android security build

on:
  push:
    branches: [security/hardening-v1]
  pull_request:

permissions:
  contents: read

jobs:
  modern-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Fetch and verify bundled components
        run: bash tools/fetch_components.sh
      - name: Test, lint and build the modern flavor
        run: ./gradlew --no-daemon :app:testModernDebugUnitTest :app:lintModernDebug :app:assembleModernDebug
